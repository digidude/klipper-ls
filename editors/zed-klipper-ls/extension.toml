id = "klipper-ls"
name = "Klipper Language Server"
version = "0.3.0"
schema_version = 1
authors = ["Dan Klaussen"]
description = "Hover docs and go-to-definition for Klipper printer.cfg, macros and sliced G-code, from klipper-ls. Pairs with the Klipper (syntax) extension."
repository = "https://github.com/digidude/klipper-ls"

[language_servers.klipper-ls]
name = "klipper-ls"
# Both languages are defined by other extensions: "Klipper" by the Klipper
# extension (github.com/digidude/klipper-syntax), "G-code" by e.g.
# ChocolateNao/zed-gcode. Zed can't declare a dependency, so the user installs
# both. Before publishing, consider `opt_in_languages = ["G-code"]`: the G-code
# extension also claims CNC formats, where Klipper/Marlin hovers would be wrong.
languages = ["Klipper", "G-code"]

[language_servers.klipper-ls.language_ids]
"Klipper" = "klipper"
"G-code" = "gcode"
