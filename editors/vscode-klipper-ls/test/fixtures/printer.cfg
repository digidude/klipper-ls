# Test config for the e2e hover check.
[include macros.cfg]

[heater_bed]
heater_pin: PB4
sensor_pin: ^!PA3
min_temp: 0
max_temp: 120

[gcode_macro PRINT_START]
description: Heat up and start
variable_bed: 60
gcode:
    {% set BED = params.BED|default(60)|float %}
    M140 S{BED}
    HEAT_SOAK TIME=5
