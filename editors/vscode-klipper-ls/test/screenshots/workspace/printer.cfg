[include macros/*.cfg]

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 235

[heater_bed]
heater_pin: PH5
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK6
control: pid
min_temp: 0
max_temp: 120

[gcode_macro PRINT_START]
description: Heat the bed and nozzle, then home
variable_soak_minutes: 5
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(210)|float %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    M140 S{BED}
    HEAT_SOAK MINUTES={printer["gcode_macro PRINT_START"].soak_minutes}
    M104 S{EXTRUDER}
