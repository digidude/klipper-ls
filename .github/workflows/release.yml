# Builds klipper-ls for each platform, plus the VS Code extension, when a
# version tag is pushed, and attaches everything to one GitHub release. The
# Zed and VS Code extensions download `klipper-ls-<target>.tar.gz` from the
# latest release, so the asset names below are part of their contract.
#
#   git tag v0.3.0 && git push origin v0.3.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on the oldest runners available, so the binary
          # links against an older glibc and still runs on Debian/Raspberry Pi OS.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          # Both macOS builds run on Apple Silicon; the x86_64 one cross-compiles.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf klipper-ls-${{ matrix.target }}.tar.gz klipper-ls
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-ls-${{ matrix.target }}
          path: klipper-ls-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  vsix:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: editors/vscode-klipper-ls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-klipper-ls/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      # The extension version follows the tag.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-ls-vsix
          path: editors/vscode-klipper-ls/*.vsix
          if-no-files-found: error

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
