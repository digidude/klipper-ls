[package]
name = "klipper-ls"
version = "0.3.0"
edition = "2024"
description = "Language server for Klipper printer config: hover docs and go-to-definition"
license = "MIT"
publish = false
repository = "https://github.com/digidude/klipper-ls"

[dependencies]
glob = "0.3"
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
ureq = "3"
yaml-rust2 = "0.13"

[build-dependencies]
cc = "1"
